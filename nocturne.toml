# ── Playbooks: first-response steps per category ───────────────────────────
# Placeholders: {device} {ip} {site} {site_label} {interface} {role}
[playbooks]
connectivity = [
  "Confirm reachability of {device} ({ip}) from a second vantage point to rule out a monitoring-path issue.",
  "Check the upstream switch or router port that feeds {device} for errors, err-disable or PoE faults.",
  "Verify site power and WAN status for {site_label}; a site-wide drop points upstream, not at the device.",
  "If still dark after 15 minutes, request on-site hands to check power, cabling and link lights.",
]
interface = [
  "Pull interface counters on {device} {interface}: CRC, input errors, drops and last flap time.",
  "Check speed and duplex against the far end and look for recent configuration changes.",
  "Reseat or replace the patch cable or optic if errors keep climbing.",
  "If the port feeds a UPS, AP or uplink, validate the downstream device separately.",
]
power = [
  "Read the UPS status, load and battery runtime for {device}; note any 'on battery' transitions.",
  "Confirm utility power at {site_label} with the branch and check the building's power events.",
  "Schedule a battery self-test or replacement if the battery status is not 'Normal'.",
]
wireless = [
  "Check the AP's CAPWAP join state and uptime on the wireless controller.",
  "Verify PoE budget and the switch port that powers the AP; bounce PoE once if it is stuck.",
  "Review controller licence headroom and DHCP scope for the AP VLAN.",
  "Ask the branch whether handhelds or scanners are affected to size the impact.",
]
routing = [
  "Check WAN/BGP neighbour state and the carrier circuit for {site_label}.",
  "Confirm SD-WAN failover took over and traffic is flowing on the secondary path.",
  "Open or update a carrier ticket with the circuit ID if the primary path is down.",
]
hardware = [
  "Review hardware health on {device}: fans, PSUs, temperature and stack members.",
  "Check environmental conditions in the IDF/MDF at {site_label}.",
  "Raise an RMA if a component remains critical after a reseat.",
]
performance = [
  "Identify top processes and top talkers on {device} (CPU, memory, interface utilisation).",
  "Compare with the device's normal hourly profile to separate a spike from a trend.",
  "Apply QoS or schedule maintenance if utilisation stays above threshold.",
]
inventory = [
  "Confirm the monitoring change was intentional (added, removed, renamed or unmanaged).",
  "Update the CMDB record for {device} if the inventory change is permanent.",
]
monitoring = [
  "Treat as a monitoring-system notice; correlate with member device alerts before acting.",
  "Check the polling engine's health if many groups change state at once.",
]
other = [
  "Read the full event message and the device's recent timeline for context.",
  "Check recent changes and escalate to the owning team if the impact is unclear.",
]
